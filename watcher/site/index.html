<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Job Watch</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>👀</text></svg>">
</head>
<body>
<header>
  <div class="bar">
    <a id="back" class="back" href="#/" hidden>‹ Companies</a>
    <h1 id="heading">Job Watch</h1>
    <span id="freshness" class="fresh">loading…</span>
  </div>
  <p id="stale" class="stale" hidden></p>
  <div class="controls">
    <input id="q" type="search" inputmode="search" placeholder="Filter…" autocomplete="off"
           aria-label="Filter">
    <label class="toggle"><input id="newonly" type="checkbox"> New only</label>
    <button id="markread" class="markread" type="button" hidden>Mark read</button>
  </div>
  <p id="summary" class="summary"></p>
</header>

<button id="refresh" class="refresh" type="button" hidden aria-live="polite"></button>

<main id="list" aria-live="polite"></main>

<p id="empty" class="empty" hidden>Nothing here.</p>
<div class="more-wrap"><button id="more" class="more" type="button" hidden></button></div>
<footer>
  <p>Read-only view. Updated when the watcher on the laptop finds something.</p>
</footer>

<template id="companyrow">
  <a class="company-row" href="#/">
    <span class="company-name"></span>
    <span class="company-meta"></span>
    <span class="chev" aria-hidden="true">›</span>
  </a>
</template>

<template id="row">
  <article class="job">
    <a class="hit" target="_blank" rel="noopener noreferrer">
      <span class="title"></span>
      <span class="meta"><span class="company"></span> · <span class="location"></span></span>
      <span class="when"></span>
    </a>
    <button class="copy" type="button">Copy req</button>
  </article>
</template>

<script src="app.js" defer></script>
</body>
</html>
