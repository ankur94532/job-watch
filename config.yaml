# Job Watcher config.
#
# Active entries below were verified with a live fetch when added or recovered,
# most recently on 2026-09-20. Evidence and endpoint quirks: watcher/adapters/README.md
#
# Per-company `title:` / `location:` lists REPLACE the defaults for that company.
# `page_delay:` (seconds) overrides the gap between requests within one company.
# `interval:` (seconds) overrides the poll cadence — default 900, or 3600 for any
# paginated board (Workday, Eightfold, amazon.jobs), which cost dozens of
# requests per sweep and mostly cannot revalidate with an ETag.
# `ats: unsupported` companies are listed so it is visible they are NOT watched.
#
# Keep `companies:` as the last block — `watcher detect --write` appends to it.

defaults:
  # Pacing. Deliberately slow PER HOST: one company at a time and one page at a
  # time on any one server, both jittered ±30%. Different hosts are polled in
  # parallel (`parallel` of them at once; Workday tenants at most 3 at a time),
  # because serial polling could not keep up: 44 fifteen-minute boards alone
  # needed ~88s of a 50s run, so a third of them starved for hours.
  # `run_budget` is the seconds multi-page sweeps (Workday, Amazon...) may use
  # per run; they pause on time and resume next run. A specific board may set a
  # longer `poll_budget` after it earns a slot; that does not extend the shared
  # deadline for starting other paginated boards. Single-request boards may
  # run `overrun` seconds past it, so every due one is polled every run: the ~22
  # Greenhouse boards share one host, hence one lane, and need ~65s.
  # 120s, not 50: at 50 the ~2,000-row Workday boards (walmart, nvidia,
  # wellsfargo) got 60-300 rows a run and could not finish a sweep inside
  # CURSOR_MAX_AGE (3h), so each restarted from zero and closed reqs were never
  # retired. A run is typically ~2 min and never more than budget + overrun
  # (~4 min), well inside the 15-minute interval. `parallel: 1` = serial.
  company_delay: 1.2
  page_delay: 0.5
  run_budget: 120
  overrun: 120
  parallel: 8

  # Workday location strings usually omit the country ("Bengaluru", "Chennai"),
  # so India cities are listed explicitly alongside "india".
  location: [india, bangalore, bengaluru, hyderabad, chennai, pune, mumbai,
             gurugram, gurgaon, noida, delhi, remote]
  # Most-wanted first: alert ranking uses this order. No seniority or
  # years-of-experience terms on purpose — Indian offices post generic
  # "Software Engineer" reqs with no level attached.
  title: [software engineer, software engineering, software development engineer,
          member of technical staff, mts, amts, smts, lmts, pmts, sde, backend,
          back end, full stack, fullstack, distributed, search, relevance,
          infrastructure, platform, machine learning, low latency, systems engineer]

# Read-only phone view: static UI plus job/tick data in Workers KV (see DEPLOY.md).
# `watcher run` refreshes one KV snapshot; Pages deploys only when UI code changes.
export:
  enabled: true
  out: docs
  publish: true
  deploy: direct
  data: kv             # one KV write per run; Pages deploys only when site code changes
  project: job-watch-live
  kv_state: 152c2da267bb450188ab82661736e670
  url: https://job-watch-live.pages.dev/   # Cloudflare Pages, behind Access

